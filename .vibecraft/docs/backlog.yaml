    title: |-
      Добавь на график линию текущей цены (как на TradingView).

      Требования:
      1. На графике должна быть горизонтальная пункт...
    description: >-
      Добавь на график линию текущей цены (как на TradingView).


      Требования:

      1. На графике должна быть горизонтальная пунктирная линия, которая
      двигается вместе с текущей ценой (LIVE).

      2. Справа (на оси цен) должен быть бейдж (плашка) с текущей ценой, которая
      обновляется в реальном времени. 

      3. Бейдж должен быть зеленым, если цена растет (или выше цены открытия), и
      красным, если падает (или ниже). Если это сложно, просто сделай его
      нейтральным (серым) с ярким текстом.

      4. В библиотеке lightweight-charts используй метод
      series.createPriceLine() с параметрами: 
         - price: текущая цена
         - color: '#4A9EFF' (или зеленый/красный)
         - lineWidth: 1
         - lineStyle: 2 (пунктирная)
         - axisLabelVisible: true

      Добавь в клиентское приложение (Mini App) раздел "Рефералы" (партнерская
      программа).


      Требования:

      1. Определение реферала: если пользователь заходит по ссылке вида
      t.me/YourBot?startapp=INF_12345, бэкенд при регистрации сохраняет этого
      инфлюенсера как referrer_id для нового пользователя.

      2. В профиле (или в нижнем меню) добавь вкладку "Рефералы".

      3. В этой вкладке показывай:
         - Ссылку пользователя для приглашений: t.me/YourBot?startapp=INF_ЕГО_UID (кнопка "Скопировать").
         - Процент вознаграждения (тянется из БД, по умолчанию 0%).
         - Реферальный баланс (в USDT, отдельно от основного баланса).
         - Количество приглашенных рефералов.
         - Кнопку "Вывести реферальные" (создает заявку на вывод, если баланс >= $10, тип заявки 'referral').
      4. Если пользователь не является инфлюенсером (процент = 0), показывай
      заглушку: "Свяжитесь с поддержкой, чтобы стать партнером".

      5. Начисление: когда реферал пополняет баланс (через Bitsby), инфлюенсеру
      автоматически начисляется % от суммы депозита на его реферальный баланс.
