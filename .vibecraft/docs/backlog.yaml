version: 1
tasks:
  - id: task-9969
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу приложения со статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения. Остальные страницы приложения реализовывать не нужно.

      Стиль — тёмный терминал: глубокий тёмный фон, плотные панели, график в
      центре, крупные кнопки ВВЕРХ и ВНИМ, компактные селекторы крипто-пары,
      суммы ставки и времени экспирации, заметный блок текущей цены. Вверху
      показан один общий баланс пользователя. Интерфейс рассчитан на узкий экран
      телефона внутри Telegram.
    status: completed
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Данные отображаются из статических заглушек
      - На экране видны график, текущая цена, селекторы пары, суммы и времени,
        кнопки ВВЕРХ и ВНИЗ, а также единый баланс
      - Интерфейс выполнен в тёмной терминальной стилистике и корректно
        помещается на узком экране телефона без горизонтальной прокрутки
      - В интерфейсе нигде не используется слово «Демо» и нет визуального
        разделения средств
    summary:
      Главная страница собрана как тёмный торговый терминал на статических
      данных из lib/market-data.ts. Реализованы общий баланс, переключатель пар,
      график с текущей ценой, выбор суммы и экспирации, крупные кнопки ВВЕРХ и
      ВНИЗ; основная логика находится в components/trading-terminal.tsx и
      app/page.tsx.
  - id: task-5247
    title: Реальные котировки в терминале
    description: >-
      Подключить к терминалу реальные котировки Binance, чтобы пользователь
      видел живую цену выбранной крипто-пары и график, обновляющийся в реальном
      времени.

      Пользователь может переключаться между парами (BTC, ETH и другие). Если
      источник котировок временно недоступен, пользователь видит понятное
      состояние вместо пустого экрана.
    status: completed
    acceptance_criteria:
      - Текущая цена выбранной пары обновляется в реальном времени
      - График обновляется вместе с ценой и соответствует выбранной паре
      - Переключение между крипто-парами сразу меняет цену и график
      - При недоступности источника котировок пользователь видит понятное
        сообщение, а не пустой экран
    summary:
      "К терминалу подключены живые котировки Binance через серверный прокси
      /api/market: цена и минутный график выбранной пары обновляются каждые 3
      секунды, пары переключаются с предзагрузкой и кэшем. При недоступности
      Binance показывается понятное состояние с повтором, последние данные
      остаются на экране с пометкой о потере связи. Основная реализация —
      lib/binance.ts, app/api/market/route.ts, hooks/use-market-quotes.ts и
      components/trading-terminal.tsx."
  - id: task-9647
    title: Ставка и расчёт результата сделки
    description: >-
      Дать пользователю возможность заключить сделку: указать сумму ставки,
      время экспирации (таймер или точное время) и направление — ВВЕРХ или ВНИЗ.

      Минимальное время экспирации — 1 минута, более коротких вариантов нет.
      После подтверждения сумма списывается с общего баланса автоматически:
      сначала из внутренних демо-средств, затем из реальных; пользователь не
      выбирает источник списания и не видит его.

      По истечении времени экспирации сделка закрывается: пользователь видит
      результат (выигрыш или проигрыш) и обновлённый баланс без перезагрузки
      страницы. Ставка не может превышать доступный баланс и лимиты платформы.
    status: completed
    acceptance_criteria:
      - Пользователь выбирает сумму, время экспирации и направление, затем
        подтверждает ставку
      - Минимальный доступный таймфрейм — 1 минута, более короткие варианты
        недоступны
      - После подтверждения сумма ставки сразу уменьшает общий баланс
      - По истечении времени экспирации пользователь видит результат сделки и
        обновлённый баланс без перезагрузки страницы
      - Ставка больше доступного баланса или больше лимита не проходит,
        пользователь видит понятное объяснение
      - В процессе ставки и результата нигде не упоминаются демо-средства и не
        показывается источник списания
    summary: Реализованы ставки с выбором суммы, экспирации от 1 минуты и
      направления с шагом подтверждения. Серверная логика в
      lib/trading-service.ts и lib/models.ts списывает сумму с общего баланса,
      закрывает сделку по котировкам и обновляет баланс; API —
      app/api/trades/route.ts, состояние — hooks/use-trading.ts, UI с таймером и
      результатом — components/trading-terminal.tsx.
  - id: task-6013
    title: Профиль с UID и история ставок
    description: >-
      Сделать экран профиля: числовой UID пользователя, текущий общий баланс и
      история ставок с результатами.

      UID присваивается каждому новому пользователю последовательно, первый —
      624839, и используется в поддержке и при общении с администратором.

      История сохраняется между сессиями и не теряется при повторном открытии
      приложения.
    status: completed
    acceptance_criteria:
      - В профиле отображается числовой UID, первый пользователь получает
        624839, следующие — по порядку
      - В профиле показан единый баланс без разделения на реальные и
        демо-средства
      - В истории ставок видны пара, направление, сумма, время экспирации и
        результат каждой ставки
      - История ставок сохраняется после перезагрузки приложения и повторного
        открытия
    summary: "Добавлен экран профиля с числовым UID (первый — 624839, далее
      последовательно через счётчик), единым общим балансом и историей ставок:
      пара, направление, сумма, время экспирации, результат и выплата. История
      читается из DynamoDB и сохраняется между сессиями; основная реализация —
      components/profile-screen.tsx, app/profile/page.tsx, lib/models.ts и
      lib/trading.ts, навигация — components/app-nav.tsx."
  - id: task-6985
    title: Пополнение через USDT в сети TON
    description: >-
      Дать пользователю возможность пополнить баланс криптовалютой USDT в сети
      TON через платёжный шлюз.

      Пользователь выбирает сумму, получает реквизиты или ссылку на оплату и
      после подтверждения платежа видит, что средства зачислены: сумма сразу
      отражается в общем балансе, а операция пополнения появляется в истории со
      статусом.

      Если платёж ещё не подтверждён, пользователь видит понятный статус
      ожидания.
    status: completed
    acceptance_criteria:
      - Пользователь может выбрать сумму пополнения и получить реквизиты или
        ссылку на оплату USDT в сети TON
      - После подтверждения платежа сумма зачисляется в общий баланс без
        перезагрузки страницы
      - Операция пополнения появляется в истории со статусом и датой
      - Неподтверждённый платёж отображается как ожидающий, а не как зачисленный
    summary:
      Добавлен экран пополнения USDT в сети TON с выбором суммы, счётом на
      оплату, проверкой статуса и историей операций. Подтверждение зачисляет
      средства в общий баланс без перезагрузки, а ожидающие платежи остаются
      отдельным статусом. Основная реализация — components/wallet-screen.tsx,
      components/deposit-checkout.tsx, app/api/deposits, lib/deposit-service.ts
      и lib/ton-payment-gateway.ts; данные хранятся в таблице deposits.
  - id: task-9525
    title: Заявка на вывод USDT или СБП
    description: >-
      Дать пользователю возможность оформить заявку на вывод средств в USDT или
      на СБП.

      Пользователь указывает сумму и реквизиты, отправляет заявку и видит её
      статус: на обработке, выплачено или отклонено с причиной. Выплаты
      выполняются только вручную администратором, автоматических выплат нет.

      Сумма вывода не может превышать доступный баланс и лимиты платформы.
    status: completed
    acceptance_criteria:
      - Пользователь может создать заявку на вывод в USDT или СБП, указав сумму
        и реквизиты
      - После отправки заявка получает статус «на обработке» и видна
        пользователю в истории операций
      - При отклонении заявки пользователь видит причину отклонения
      - При выплате заявка получает статус «выплачено»
      - Заявка на сумму больше доступного баланса или больше лимита не
        создаётся, пользователь видит понятное объяснение
    summary: Реализован экран вывода средств с выбором USDT или СБП, суммой и
      реквизитами, проверкой доступного баланса и лимитов, а также историей
      заявок со статусами «На обработке», «Выплачено», «Отклонено» и причиной
      отклонения. Заявки хранятся в DynamoDB в таблице withdrawals, резервируют
      сумму из доступного баланса и обрабатываются вручную через API; основная
      реализация — components/withdrawal-screen.tsx, hooks/use-withdrawals.ts,
      lib/withdrawal-service.ts и app/api/withdrawals.
  - id: task-0116
    title: Промокоды и отыгрыш бонуса
    description: >-
      Добавить в приложение ввод промокода. Введённый промокод начисляет бонус и
      показывает пользователю прогресс отыгрыша по единому проценту, который
      задаёт старший администратор.

      Демо-средства не участвуют в отыгрыше бонуса. Недействительный или уже
      использованный промокод даёт пользователю понятное сообщение об ошибке.
    status: completed
    acceptance_criteria:
      - Пользователь может ввести промокод и получить бонус на баланс
      - После активации промокода пользователь видит прогресс отыгрыша бонуса по
        заданному проценту
      - Прогресс отыгрыша растёт только за счёт реальных ставок, демо-средства в
        отыгрыше не участвуют
      - Недействительный или повторно использованный промокод не начисляет
        бонус, пользователь видит понятное сообщение
      - Начисление бонуса появляется в истории операций
    summary:
      "Реализованы промокоды: бонус зачисляется на реальный баланс, прогресс
      отыгрыша считается по единому проценту из настроек и растёт только на
      реальную часть ставки. Недействительный и повторно использованный код дают
      понятную ошибку, а начисление видно в истории операций и карточке
      отыгрыша. Основная реализация — lib/promo-service.ts,
      app/api/promo/route.ts, components/promo-bonus-card.tsx и
      hooks/use-promo.ts; до админ-панели действуют коды WELCOME и PULSE100."
  - id: task-0557
    title: "Админ-панель: обработка заявок на вывод"
    description: >-
      Создать админ-панель сотрудника с разделом заявок на вывод.

      Администратор видит список заявок с суммой, реквизитами, UID пользователя
      и датой и может отметить заявку как «Выплачено» или отклонить её с
      обязательным указанием причины. Отклонение без причины недоступно, а
      причина сразу становится видна пользователю в его приложении.

      Интерфейс админ-панели остаётся текстовым и кнопочным, без сложных
      графиков.
    status: completed
    acceptance_criteria:
      - Администратор видит список заявок на вывод с суммой, реквизитами, UID и
        датой
      - Администратор может отметить заявку как «Выплачено», и пользователь
        видит этот статус у себя
      - Администратор может отклонить заявку только с указанием причины
      - После отклонения пользователь видит причину отклонения в своём приложении
      - Интерфейс админ-панели выполнен в виде текста и кнопок без сложных
        графиков
    summary: "Создана админ-панель /admin с разделом заявок на вывод: список с
      суммой, реквизитами USDT/СБП, UID и датой, фильтр по статусу и кнопки
      «Выплачено» и «Отклонить». Отклонение доступно только после ввода причины,
      после решения статус и причина сразу отображаются пользователю в истории
      выводов. Основная реализация — app/admin/page.tsx,
      components/admin-withdrawals-panel.tsx, hooks/use-admin-withdrawals.ts,
      app/api/admin/withdrawals/route.ts и lib/withdrawal-service.ts."
  - id: task-0550
    title: "Админ-панель: пользователи, лимиты, промокоды и роли"
    description: >-
      Дополнить админ-панель управлением пользователями и настройками платформы.

      Администратор находит пользователя по UID и видит его баланс раздельно —
      реальные и демо-средства — а также историю ставок и операций.
      Администратор может менять лимиты ставок и вывода и управлять промокодами.

      Доступ к разделам зависит от роли: Владелец, Старший админ, Менеджер,
      Саппорт. Саппорт не может менять балансы и обрабатывать выплаты, Владелец
      и Старший админ имеют полный доступ. Каждое действие с деньгами
      фиксируется в журнале: кто, когда и что изменил.
    status: completed
    acceptance_criteria:
      - Поиск пользователя по UID показывает его баланс раздельно — реальные и
        демо-средства — и историю ставок и операций
      - Администратор может изменить лимиты ставок и вывода, изменения
        применяются к новым ставкам и заявкам
      - Администратор может создавать, редактировать и отключать промокоды
      - "Разделы и действия в админ-панели ограничены ролью сотрудника: Саппорт
        не может менять балансы и обрабатывать выплаты"
      - Каждое действие с деньгами попадает в журнал с указанием сотрудника,
        времени и сути изменения
    summary:
      Админ-панель расширена разделами пользователей, лимитов, промокодов и
      журнала действий с ролевым доступом (Владелец, Старший админ, Менеджер,
      Саппорт). Поиск по UID показывает реальный и демо-баланс, историю ставок и
      операций; лимиты применяются к новым ставкам и заявкам, промокоды можно
      создавать, менять и отключать, а денежные действия пишутся в журнал с
      сотрудником, временем и сутью. Основная реализация —
      components/admin-console.tsx, lib/admin-service.ts, app/api/admin/* и
      таблица admin_audit_log.
  - id: task-1554
    title: Чат поддержки и тикеты
    description: >-
      Добавить в приложение чат поддержки. Сообщение пользователя превращается в
      тикет, который попадает специалисту в админ-панель со статусом «новое».

      Специалист берёт тикет в работу и отвечает, пользователь видит ответ в том
      же чате и понимает, что обращение обработано. Обращение можно закрыть,
      после закрытия переписка остаётся доступной в истории.
    status: completed
    acceptance_criteria:
      - Пользователь может отправить сообщение в поддерж��у из приложения и
        видеть историю переписки
      - Обращение появляется у сотрудников в админ-панели со статусом «новое» и
        может быть взято в работу
      - После ответа специалиста пользователь видит сообщение в чате
      - Обращение можно закрыть, после закрытия переписка остаётся доступной в
        истории
    summary:
      "Добавлен чат поддержки: сообщение создаёт тикет, переписка хранится в
      DynamoDB (support_tickets), а в админ-панели появился раздел «Поддержка»
      со статусами «Новое», «В работе», «Закрыто», взятием в работу, ответом и
      закрытием. Пользователь видит ответы в том же чате, автоматическое
      обновление и историю закрытых обращений; основная реализация —
      components/support-screen.tsx, components/admin-support-panel.tsx,
      lib/support-service.ts и app/api/support."
  - id: task-1053
    title:
      Интерфейс нужно сделать более минималистичным и профессиональным (как в
      Robinhood или Binance). Сейчас слишком много ...
    description: >-
      Интерфейс нужно сделать более минималистичным и профессиональным (как в
      Robinhood или Binance). Сейчас слишком много крупных блоков, приходится
      скроллить.


      Внеси следующие изменения:

      1. Убери большие карточки BTC/ETH/SOL сверху. Вместо них сделай компактную
      строку выбора актива (например, маленький дропдаун с иконкой и названием
      пары), которая не занимает много места.

      2. Уменьши блок "Текущая цена". Цифра должна быть крупной, но не
      гигантской. Рядом оставь маленький процент изменения за 24ч.

      3. График сделай больше по высоте. Убери лишние отступы.

      4. Блоки выбора суммы и времени экспирации сожми. Сделай их в виде
      компактных горизонтальных строк с кнопками (пилюлями).

      5. Убери дублирующий текст под кнопками ВВЕРХ/ВНИЗ ("Ставка 1000
      USDT...").

      6. Сделай так, чтобы терминал (график + сумма + время + кнопки ВВЕРХ/ВНИЗ)
      умещался на одном экране мобильного телефона без скролла.


      И важное по графику:

      - По умолчанию график должен отображаться в виде Японских свечей
      (Candlestick), а не просто линией.

      - Добавь маленькую иконку/переключатель в углу графика, чтобы менять тип
      на Линию (Line chart).

      - Обязательно используй библиотеку lightweight-charts (TradingView) для
      отрисовки.
    status: completed
    acceptance_criteria:
